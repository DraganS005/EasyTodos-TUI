[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-tui"
version = "2.2.0"
description = "A small, mouse-friendly terminal todo list with groups."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.2,<9",
]

[project.scripts]
todo-tui = "todo_tui.cli:main"

[tool.setuptools.packages.find]
include = ["todo_tui*"]

[tool.setuptools.package-data]
todo_tui = ["app.tcss"]
