[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easytodos-tui"
version = "2.3.0"
description = "easytodos: a small, mouse-friendly terminal todo list with groups."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.2,<9",
]

[project.scripts]
easytodos = "easytodos.cli:main"

[tool.setuptools.packages.find]
include = ["easytodos*"]

[tool.setuptools.package-data]
easytodos = ["app.tcss"]
